<!doctype html>
<html lang="is">
  <body style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#f5f5f4; padding:24px;">
    <div style="max-width:420px; margin:0 auto; background:#fff; border-radius:12px; padding:24px;">
      <h1 style="font-size:22px; margin:0 0 12px; color:#ea580c;">Partar</h1>
      <p style="font-size:16px; line-height:1.5;">Ýttu á hnappinn til að skrá þig inn.</p>
      <p style="margin:24px 0;">
        <!-- RedirectTo er /auth/confirm?next=… ; type=email gildir bæði fyrir innskráningu og nýskráningu, og token_hash virkar líka í öðrum vafra -->
        <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email"
           style="display:inline-block; background:#ea580c; color:#fff; text-decoration:none; padding:14px 22px; border-radius:10px; font-weight:600;">
          Skrá inn
        </a>
      </p>
      <p style="font-size:13px; color:#78716c;">Hlekkurinn gildir í eina klukkustund. Ef þú baðst ekki um þetta máttu hunsa þennan póst.</p>
    </div>
  </body>
</html>
